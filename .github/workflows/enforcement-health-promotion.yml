name: Enforcement Health Promotion

# pull_request_target loads this workflow from the default branch. The job may
# inspect fetched PR Git objects as hostile data, but it never creates or
# executes a PR working tree.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]

permissions: {}

concurrency:
  group: enforcement-health-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforcement-health-promotion:
    name: Enforcement Health Promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch the exact PR head as bounded-history Git objects
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROMOTING_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "invalid pull-request number" >&2
            exit 1
          }
          [[ "$PROMOTING_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid pull-request head SHA" >&2
            exit 1
          }
          git fetch --no-tags --filter=blob:none --depth=256 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          fetched_head="$(git rev-parse refs/remotes/pull/head)"
          [[ "$fetched_head" == "$PROMOTING_HEAD" ]] || {
            echo "fetched pull-request head does not match the event SHA" >&2
            exit 1
          }

      - name: Set up trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"

      - name: Install trusted verifier dependencies
        working-directory: harness
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci --ignore-scripts

      - name: Materialize the bounded committed head matrix
        env:
          PROMOTING_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_MATRIX_PATH: ${{ runner.temp }}/head-suite-compatibility.json
        run: |
          set -euo pipefail
          MAX_HEAD_MATRIX_BYTES=1048576
          [[ "$PROMOTING_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid pull-request head SHA" >&2
            exit 1
          }
          matrix_object="${PROMOTING_HEAD}:harness/suite-compatibility.json"
          [[ "$(git cat-file -t "$matrix_object")" == "blob" ]] || {
            echo "head matrix is not a Git blob" >&2
            exit 1
          }
          matrix_size="$(git cat-file -s "$matrix_object")"
          [[ "$matrix_size" =~ ^[0-9]+$ ]] || {
            echo "invalid head matrix size" >&2
            exit 1
          }
          (( matrix_size <= MAX_HEAD_MATRIX_BYTES )) || {
            echo "head matrix exceeds ${MAX_HEAD_MATRIX_BYTES} bytes" >&2
            exit 1
          }
          git show "$matrix_object" > "$HEAD_MATRIX_PATH"
          actual_size="$(wc -c < "$HEAD_MATRIX_PATH" | tr -d ' ')"
          [[ "$actual_size" == "$matrix_size" ]] || {
            echo "head matrix size changed during materialization" >&2
            exit 1
          }

      - name: Verify enforcement-health promotion
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PROMOTING_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_MATRIX_PATH: ${{ runner.temp }}/head-suite-compatibility.json
        run: |
          set -euo pipefail
          npx --no-install tsx src/enforcement_health_promotion_cli.ts \
            --base-matrix suite-compatibility.json \
            --head-matrix "$HEAD_MATRIX_PATH" \
            --promoting-head "$PROMOTING_HEAD" \
            --repo-root ..
