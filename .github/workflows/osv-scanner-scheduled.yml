name: Scheduled OSV Advisory

on:
  schedule:
    - cron: "59 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  osv-npm:
    name: OSV npm advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # container image v2.7.0
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            harness/package-lock.json
        continue-on-error: true

      - name: Build advisory SARIF
        uses: google/osv-scanner-action/osv-reporter-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # container image v2.7.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner-npm
