name: Scheduled OSV Advisory

on:
  schedule:
    - cron: "59 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  osv-npm:
    name: OSV npm advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            harness/package-lock.json
        continue-on-error: true

      - name: Build advisory SARIF
        uses: google/osv-scanner-action/osv-reporter-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner-npm
